name: autopost-24x7

on:
  workflow_dispatch:
  schedule:
    # Asia/Karachi is UTC+5: 10:00, 12:00, 14:00, 16:00, 18:00 PKT.
    # GitHub Actions schedule is UTC.
    - cron: "0 5 * * *"
    - cron: "0 7 * * *"
    - cron: "0 9 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: autopost-24x7-${{ github.ref }}
  cancel-in-progress: false

jobs:
  autopost:
    name: Remote zero-cost autopost
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile autopost.py scheduler.py run_batch.py
          python -m py_compile app/main.py app/worker.py app/core/*.py app/routes/*.py app/services/*.py engine/*.py

      - name: Run one scheduled slot
        shell: bash
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          AI_PROVIDER: local
          LOCAL_AI_LANGUAGE: en
          POST_STATUS: publish
          POSTS_PER_RUN: "1"
          RUN_ONCE: "1"
          SLOT_TIME: ${{ github.event_name == 'push' && '10:00' || '' }}
        run: |
          set -euo pipefail

          if [ -z "${WP_URL:-}" ] || [ -z "${WP_USER:-}" ] || [ -z "${WP_APP_PASSWORD:-}" ]; then
            echo "::error::Missing WP_URL, WP_USER, or WP_APP_PASSWORD GitHub Secrets."
            exit 1
          fi

          python scheduler.py

      - name: Persist runtime state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json trends.json keywords.json data/ scheduler.log config/schedule.json || true

          if git diff --cached --quiet; then
            echo "No runtime state changes to commit."
            exit 0
          fi

          git commit -m "Update autopost runtime state"
          git pull --rebase origin main
          git push origin HEAD:main
