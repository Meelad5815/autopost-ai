name: MRK Continuous Website Upgrade

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: mrk-continuous-upgrade
  cancel-in-progress: true

jobs:
  research-gap-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Research programming ecosystems
        run: python language_researcher.py --purpose "easy-to-run websites, AI automation and online services"

      - name: Detect feature gaps
        run: python feature_gap_detector.py --product "MRK AI Website Factory" --purpose "easy-to-run websites, automation, SEO and online services"

      - name: Create reviewable upgrade candidate
        run: python feature_upgrade_engine.py

      - name: Generate isolated feature implementation
        run: python upgrade_candidate_runner.py

      - name: Build current website package
        run: |
          if [ -f data/website_factory/site_spec.json ]; then
            python website_content.py
            python website_builder.py
          else
            echo "No Website Factory specification yet; research and gap detection completed."
          fi

      - name: Create deployment and rollback manifest
        run: python deployment/mrk-deployment-manifest.py

      - name: Run automated safety and artifact tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify isolated deployment gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/upgrade_candidate_execution.json")
          if p.exists():
              data=json.loads(p.read_text(encoding="utf-8"))
              assert data.get("production_changed") is False
              assert data.get("deployment_allowed") is False
          manifest=json.loads(Path("data/deployment_manifest.json").read_text(encoding="utf-8"))
          assert manifest["deployment"]["automatic_deployment"] is False
          assert manifest["deployment"]["requires_explicit_workflow_dispatch"] is True
          approval=Path("data/upgrade_approval.json")
          if approval.exists():
              raise SystemExit("Approval artifact is not accepted by the continuous research job; deployment requires a separate explicit workflow.")
          print("Deployment gate verified: blocked by default.")
          PY

      - name: Lightweight SEO and HTML checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path("data/website_factory/site")
          if root.exists():
              pages=list(root.rglob("*.html"))
              if not pages:
                  raise SystemExit("No generated HTML pages found")
              for p in pages:
                  s=p.read_text(encoding="utf-8")
                  assert re.search(r"<title>[^<]+</title>",s,re.I), f"Missing title: {p}"
                  assert re.search(r'<meta[^>]+name=["\\\']description["\\\']',s,re.I), f"Missing meta description: {p}"
                  assert "<html" in s.lower() and "</html>" in s.lower(), f"Invalid HTML shell: {p}"
              print(f"Checked {len(pages)} HTML pages")
          else:
              print("No generated site package; artifact tests still passed.")
          PY

      - name: Commit research and safe generated upgrades
        run: |
          git config user.name "MRK Continuous Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git add data/language_research.json data/feature_gaps.json data/upgrade_candidates.json data/upgrade_candidate_execution.json data/deployment_manifest.json data/website_factory
          git diff --cached --quiet || git commit -m "chore: continuous MRK research, gap detection and upgrade"
          git push
