name: conversion-report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build conversion report
        run: |
          python - <<'PY'
          import json
          from engine.conversion_tracking import build_conversion_report
          from pathlib import Path
          Path("data/conversion_report.json").write_text(
              json.dumps(build_conversion_report(), ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conversion_report.json data/conversion_events.json
          if git diff --cached --quiet; then
            echo "No conversion-report changes."
            exit 0
          fi
          git commit -m "Update conversion tracking report"
          git pull --rebase origin main
          git push origin HEAD:main
