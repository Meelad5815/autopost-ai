name: content-refresh-plan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: content-refresh-plan
  cancel-in-progress: false

jobs:
  refresh-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests>=2.31.0,<3.0.0

      - name: Build conservative refresh plan
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          MIN_REFRESH_IMPRESSIONS: "50"
          MAX_REFRESH_POSITION: "30"
          MAX_REFRESH_PLANS: "10"
        run: |
          python - <<'PY'
          import os
          from engine.wp_client import get_posts
          from engine.refresh_engine import build_refresh_plans
          posts = get_posts(
              os.environ["WP_URL"],
              os.environ["WP_USER"],
              os.environ["WP_APP_PASSWORD"],
              60,
              per_page=100,
          )
          report = build_refresh_plans(posts)
          print("Refresh-plan status:", report.get("status"))
          print("Plans:", len(report.get("plans", [])))
          PY

      - name: Persist plan
        run: |
          git config user.name "mrk-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/refresh_plans.json
          git diff --cached --quiet || git commit -m "chore: update content refresh plan"
          git push
