name: autonomous-developer

on:
  workflow_dispatch:
  schedule:
    - cron: "11 */3 * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-developer-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run autonomous developer audit
        run: python -m engine.autonomous_developer
      - name: Persist audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/autonomous_developer.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh autonomous developer audit"
          git pull --rebase origin main
          git push origin HEAD:main
