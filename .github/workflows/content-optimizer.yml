name: content-optimizer

on:
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"

permissions:
  contents: write

concurrency:
  group: content-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests>=2.31.0,<3.0.0

      - name: Build optimization report
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from engine.wp_client import get_posts
          from engine.content_optimizer import build_optimization_report
          posts = get_posts(os.environ["WP_URL"], os.environ["WP_USER"], os.environ["WP_APP_PASSWORD"], 60, per_page=100)
          report = build_optimization_report(posts)
          print("Optimization status:", report.get("status"))
          print("CTR opportunities:", len(report.get("opportunities", [])))
          print("Query gaps:", len(report.get("query_gaps", [])))
          PY

      - name: Persist report
        run: |
          git config user.name "mrk-content-optimizer-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content_optimizer.json
          git diff --cached --quiet || git commit -m "chore: update content optimization report"
          git push
