name: google-research-24x7

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
concurrency:
  group: google-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install 'requests>=2.31.0,<3.0.0'
      - name: Research
        run: python research.py
      - name: Save research state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research.json improvement_queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Google research intelligence'
          git pull --rebase origin main
          git push origin HEAD:main