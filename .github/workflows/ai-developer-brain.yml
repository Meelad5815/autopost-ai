name: ai-developer-brain

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write

jobs:
  brain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate proposal
        env:
          AI_DEV_ENDPOINT: ${{ secrets.AI_DEV_ENDPOINT }}
          AI_DEV_MODEL: ${{ secrets.AI_DEV_MODEL }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from engine.ai_developer_brain import propose
          report = Path("data/autonomous_developer.json")
          prompt = report.read_text(encoding="utf-8") if report.exists() else "No audit report yet."
          out = propose(prompt)
          Path("data/ai_developer_proposal.json").write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Persist proposal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_developer_proposal.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh AI developer proposal"
          git push origin HEAD:main
