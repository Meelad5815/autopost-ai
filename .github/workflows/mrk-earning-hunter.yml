name: MRK Earning Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run opportunity hunter
        run: python mrk_earning_hunter.py
      - name: Commit report
        run: |
          git config user.name "MRK AI Earning Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/earning_opportunities.json data/earning_opportunities.md
          git diff --cached --quiet || git commit -m "chore: refresh earning opportunities"
          git push
