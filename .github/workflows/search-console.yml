name: google-search-console

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: google-search-console
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth>=2.30.0,<3.0.0

      - name: Validate configuration
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$GSC_SITE_URL"
          test -n "$GSC_SERVICE_ACCOUNT_JSON"
          python -m py_compile engine/search_console.py

      - name: Collect Search Console analytics
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_DAYS: "28"
        run: python engine/search_console.py

      - name: Persist analytics
        run: |
          git config user.name "mrk-search-console-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search_console.json
          git diff --cached --quiet || git commit -m "chore: update Search Console analytics"
          git push
