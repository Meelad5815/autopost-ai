name: autonomous-patch-gate

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-patch-gate-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build isolated patch plan
        run: python -m engine.patch_gate
      - name: Validate repository
        run: |
          python -m compileall -q autopost.py scheduler.py run_batch.py app engine
          if [ -d tests ]; then python -m pytest -q; fi
      - name: Persist gate result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_patch_plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh autonomous patch gate"
          git push origin HEAD:main
