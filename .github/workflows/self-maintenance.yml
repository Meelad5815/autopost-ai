name: self-maintenance

on:
  workflow_dispatch:
  schedule:
    # Run every 30 minutes. GitHub schedules are UTC.
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: self-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    name: Audit, safe-fix, test and persist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Syntax audit
        run: |
          python -m compileall -q autopost.py scheduler.py run_batch.py app engine

      - name: Safe automatic lint fixes
        run: |
          ruff check . --fix --exit-zero
          ruff format .

      - name: Tests
        run: |
          if [ -d tests ]; then
            python -m pytest -q || true
          fi

      - name: Dependency security audit
        run: |
          pip-audit -r requirements.txt || true

      - name: Persist safe maintenance changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No safe maintenance changes."
            exit 0
          fi
          git commit -m "chore: automated self-maintenance"
          git pull --rebase origin main
          git push origin HEAD:main
